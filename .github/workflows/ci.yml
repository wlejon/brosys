name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# brosys's siblings (brodbus, the shared sd-bus layer, on Linux; bronze with
# brass for the brosys_api JavaScript binding, on in a top-level build) come
# from the commits CMakeLists.txt pins (cmake/bro_deps.cmake), fetched at
# configure, so every job builds a plain clone. bronze and brass compile
# inside this build tree with the job's own compiler and CRT; the api is bound
# across bronze's C++ embed boundary, so a prebuilt bronze would be an
# unverifiable ABI hazard. Beyond those, brosys links the OS (sd-bus and,
# optionally, PipeWire on Linux).
#
# The Linux tests are real: every mutation runs on a private dbus-daemon
# against a real upowerd under umockdev, a real PipeWire + WirePlumber, real
# notify-send / gdbus / busctl clients and a real libayatana-appindicator GTK
# item. So the job installs the services and the oracle tools, not just the
# headers. A test whose service a hosted runner genuinely lacks (a user
# PipeWire session, Wi-Fi hardware) exits 77 and ctest reports it skipped,
# with the reason in the log.
#
# BROSYS_TEST_MUTATE=1: hosted runners are disposable, so the tests that write
# to the machine's real devices and desktop services (same-value audio
# writes, the api test's setters, Wi-Fi connect, Bluetooth discovery, the
# notification server and tray host on the session bus, the Windows loopback
# adapter install) run here; on a desktop they skip unless opted into.
env:
  BROSYS_TEST_MUTATE: "1"
  LINUX_BUILD_PACKAGES: >-
    ninja-build pkg-config libsystemd-dev
  LINUX_PIPEWIRE_PACKAGES: >-
    libpipewire-0.3-dev pipewire pipewire-bin wireplumber pipewire-pulse pulseaudio-utils
  LINUX_ORACLE_PACKAGES: >-
    dbus-daemon dbus-bin libnotify-bin libglib2.0-bin umockdev libumockdev-dev upower
    network-manager libayatana-appindicator3-dev xvfb xauth iproute2

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,          os: ubuntu-24.04, cc: gcc,   cxx: g++,     config: Release }
          - { name: linux-clang,        os: ubuntu-24.04, cc: clang, cxx: clang++, config: Release }
          - { name: windows-msvc,       os: windows-2022,                          config: Release }
          # Debug CRT: iterator debugging and the library's own assert()s.
          - { name: windows-msvc-debug, os: windows-2022,                          config: Debug }
          - { name: macos-arm64,        os: macos-15,                              config: Release }
    steps:
      - uses: actions/checkout@v7
        with:
          path: brosys

      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            $LINUX_BUILD_PACKAGES $LINUX_PIPEWIRE_PACKAGES $LINUX_ORACLE_PACKAGES

      # test_audio_session reads the user's own PipeWire session, read-only. The
      # runner account has a systemd user manager but no desktop login to start
      # PipeWire, so start the same user units a login would. If they cannot
      # start, the test skips and says so.
      - name: Start the user's PipeWire session (Linux)
        if: runner.os == 'Linux'
        run: |
          systemctl --user start pipewire.socket pipewire.service wireplumber.service pipewire-pulse.socket \
            || echo "::warning::could not start a user PipeWire session; test_audio_session will skip"
          systemctl --user --no-pager status pipewire.service wireplumber.service | head -20 || true

      # SwitchAudioSource is test_mac_audio's oracle.
      - name: Install packages (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja switchaudio-osx

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S brosys -B build
          else
            cmake -S brosys -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          fi

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 4

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      # ctest shows a skipped test's output nowhere, so its reason goes to the
      # job summary: a skip is only honest if someone can read why.
      - name: Skip reasons
        if: always()
        shell: bash
        run: |
          { echo "### Skipped tests (${{ matrix.name }})"; echo '```'
            grep -h 'SKIPPED:' build/Testing/Temporary/LastTest*.log || echo none
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

  # ── PipeWire-free tier ────────────────────────────────────────────────────
  #
  # BROSYS_WITH_PIPEWIRE is on whenever libpipewire-0.3 is found, so every
  # default Linux build has the audio backend. Without it the library builds
  # the honest "audio unavailable" service instead, and a stray PipeWire
  # include or symbol outside the guard compiles everywhere except here. Only
  # sd-bus is installed: no PipeWire headers, so the default resolves OFF the
  # way it would on a distribution that does not ship them.
  no-pipewire:
    name: No PipeWire · ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: brosys

      - name: Install packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $LINUX_BUILD_PACKAGES $LINUX_ORACLE_PACKAGES

      - name: Configure
        run: |
          cmake -S brosys -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          grep -q '^BROSYS_WITH_PIPEWIRE:BOOL=OFF' build/CMakeCache.txt

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Skip reasons
        if: always()
        run: |
          { echo '### Skipped tests (no PipeWire)'; echo '```'
            grep -h 'SKIPPED:' build/Testing/Temporary/LastTest*.log || echo none
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

  # ── Coverage ──────────────────────────────────────────────────────────────
  #
  # Debug (-O0), so this is also the Linux job where assert()s are live.
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: brosys

      - name: Install packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcovr \
            $LINUX_BUILD_PACKAGES $LINUX_PIPEWIRE_PACKAGES $LINUX_ORACLE_PACKAGES

      - name: Start the user's PipeWire session
        run: |
          systemctl --user start pipewire.socket pipewire.service wireplumber.service pipewire-pulse.socket \
            || echo "::warning::could not start a user PipeWire session; test_audio_session will skip"

      - name: Configure (instrumented)
        run: |
          cmake -S brosys -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBROSYS_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # pipefail: piping gcovr into tee otherwise hands the step tee's exit
      # status, so a gcovr crash produces no report and the job still goes green.
      #
      # Run from the workspace root, where build/ is, with the filters spelled
      # brosys/...: gcovr only looks for .gcda files under its root.
      - name: Report
        shell: bash
        run: |
          set -o pipefail
          mkdir -p coverage-html
          gcovr --root . \
            --filter 'brosys/src/' --filter 'brosys/include/brosys/' \
            --exclude-unreachable-branches \
            --print-summary \
            --html-details coverage-html/index.html \
            | tee coverage-summary.txt
          test -s coverage-html/index.html

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Coverage — `src/` + `include/brosys/`'
            echo
            echo 'Linux backends only (sd-bus, PipeWire); the Windows and macOS backends are exercised by the test matrix, not measured.'
            echo
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 14
